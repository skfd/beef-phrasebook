<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beef Phrasebook — the same cow, cut seven ways</title>
<meta name="description" content="Seven butchery traditions on one animal, in 3D. What a cut is called elsewhere, and how much of the same animal that name actually covers. Cow meat, beef cuts, carcass anatomy.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%90%84</text></svg>">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body data-mode="anatomy">

<div id="stage">
  <canvas id="view"></canvas>
  <div id="tooltip" hidden></div>
  <div id="loading"><span></span>Building the cow&hellip;</div>
</div>

<header id="masthead">
  <h1>Beef&nbsp;Phrasebook</h1>
  <p class="tagline">Seven butchery traditions on one animal, in 3D.</p>
</header>

<nav id="modes" aria-label="Which model">
  <button data-mode="cuts">Cuts</button>
  <button data-mode="anatomy" aria-current="true">Anatomy</button>
</nav>

<nav id="cultures" aria-label="Butchery tradition"></nav>

<aside id="legend" class="panel">
  <div class="panel-head">
    <h2 id="legend-title">Cuts</h2>
    <button id="legend-toggle" class="icon-btn" aria-expanded="true" title="Collapse">–</button>
  </div>
  <p id="blurb"></p>
  <ol id="cut-list"></ol>
  <h2 id="part-count">Anatomy</h2>
  <p id="anatomy-loading" hidden>Building the animal&hellip;</p>
  <ol id="part-list"></ol>
</aside>

<aside id="detail" class="panel" hidden>
  <button id="detail-close" class="icon-btn" title="Close">×</button>
  <div id="detail-body"></div>
</aside>

<div id="controls">
  <label class="slider" id="c-explode">
    <span>Explode</span>
    <input id="explode" type="range" min="0" max="100" value="0" aria-label="Explode the carcass">
  </label>
  <div id="anat-controls">
    <div class="layers" role="group" aria-label="Layers">
      <label class="check"><input id="layer-skin" type="checkbox"><span>Hide</span></label>
      <label class="check"><input id="layer-muscle" type="checkbox" checked><span>Muscle</span></label>
      <label class="check"><input id="layer-viscera" type="checkbox" checked><span>Organs</span></label>
      <label class="check"><input id="layer-skeleton" type="checkbox" checked><span>Bone</span></label>
      <label class="check cuts-layer"><input id="layer-cuts" type="checkbox" checked><span>Cuts</span></label>
    </div>
    <label class="slider">
      <span>Peel</span>
      <input id="peel" type="range" min="0" max="2" step="1" value="0"
             aria-label="Strip the superficial muscle layers away">
    </label>
    <label class="slider">
      <span>Cutaway</span>
      <input id="cutaway" type="range" min="0" max="100" value="0"
             aria-label="Slice the near side of the animal away">
    </label>
  </div>
  <label class="check">
    <input id="spin" type="checkbox">
    <span>Spin</span>
  </label>
  <button id="reset" class="text-btn">Reset view</button>
</div>

<footer id="colophon">
  <button id="about-btn" class="text-btn">About &amp; sources</button>
</footer>

<dialog id="about">
  <h2>About this phrasebook</h2>
  <div id="about-body"></div>
  <form method="dialog"><button class="text-btn">Close</button></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
